name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version` here on purpose: declaring it alongside `packageManager`
      # in package.json is an ERR_PNPM_BAD_PM_VERSION error, which failed the
      # job during setup — so the suite had never actually run in CI.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build first. Workspace packages resolve each other through their
      # published `dist/*.d.ts`, so on a clean checkout typecheck and test
      # cannot see a sibling that has not been built yet. Locally this passed
      # only because dist/ was left over from a previous run.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
